{% extends "base.html" %}

{% block content %}
<h1>{{ semester.name }}</h1>

<table>
    <tr>
        <th>Modul</th>
        <th>ECTS</th>
    </tr>
    {% for m in module %}
    <tr>
        <td><a href="{{ url_for('modul_ansicht', id=m.id) }}">{{ m.name }}</a></td>
        <td>{{ m.ects }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
