{% extends "base.html" %}

{% block content %}
<h1>{{ titel }}</h1>

{% if fehler %}
<p><strong>{{ fehler }}</strong></p>
{% endif %}

<form action="{{ aktion }}" method="post">
    <p>
        Bezeichnung (z. B. Prüfung 1):<br>
        <input type="text" name="name" value="{{ name }}" required>
    </p>
    <p>
        Gewichtung in %:<br>
        <input type="number" name="gewicht" value="{{ gewicht }}" min="1" max="100" required>
    </p>
    <p>
        Note (leer lassen, wenn noch offen):<br>
        <input type="number" name="note" value="{{ note }}" min="1" max="6" step="0.1">
    </p>
    <input type="submit" value="Speichern">
</form>
{% endblock %}
